# 推送 v* 標籤時打包 Windows 版並建立 GitHub Release
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 檢查版本號
        shell: pwsh
        run: |
          $version = (python -c "import huiji; print(huiji.__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "標籤 ${{ github.ref_name }} 跟 huiji/__init__.py 的版本 $version 不一致"
          }

      - name: 打包
        shell: pwsh
        run: |
          python -m pip install -q -r requirements.txt
          ./build.ps1

      - name: 建立 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-Item dist/Huiji-*-win64.zip).FullName `
            --title "會記 ${{ github.ref_name }}" --generate-notes
