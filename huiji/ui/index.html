<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會記 Huiji</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-toolbar">
      <button class="brand" id="homeBtn" title="首頁">會記</button>
      <div class="spacer"></div>
      <div class="rec-group" id="recGroup">
        <button class="icon-btn" id="recBtn" title="開始錄音 (Ctrl+Shift+R)"></button>
        <button class="icon-btn small" id="recModeBtn" title="錄音來源"></button>
      </div>
      <div class="rec-live hidden" id="recLive">
        <span class="dot"></span><span id="sideTimer">00:00</span>
        <button class="icon-btn" id="sideStop" title="停止並轉錄"></button>
      </div>
      <button class="icon-btn" id="importBtn" title="匯入音檔或影片"></button>
    </div>
    <div class="search">
      <span class="search-icon"></span>
      <input id="search" placeholder="搜尋所有會議" autocomplete="off">
    </div>
    <ul id="meetingList"></ul>
    <button id="updateBanner" class="update-banner hidden"></button>
    <div class="side-nav">
      <button id="settingsBtn" class="nav-btn"><span class="ico gear"></span>設定</button>
      <button id="trashBtn" class="nav-btn"><span class="ico trash"></span><span id="trashLabel">垃圾桶</span></button>
    </div>
  </aside>
  <div class="splitter v" id="sideSplit" title="拖曳調整側欄寬度"></div>

  <main id="main">
    <div id="home" class="page hidden">
      <div class="page-inner">
        <h1 class="page-title">會記</h1>
        <p class="page-sub">錄下會議，自動轉成逐字稿、分辨說話者，再整理成會議紀錄。</p>

        <section class="card">
          <h3>新的會議</h3>
          <div class="field">
            <label class="lbl">錄音來源</label>
            <div class="seg" id="homeMode">
              <button data-mode="both"><strong>線上會議</strong><small>麥克風＋電腦聲音</small></button>
              <button data-mode="mic"><strong>實體會議</strong><small>只錄麥克風</small></button>
              <button data-mode="system"><strong>電腦聲音</strong><small>影片、直播、課程</small></button>
            </div>
          </div>
          <div class="field">
            <label class="lbl">音量（開始前先確認有收到聲音）</label>
            <div class="home-meters">
              <div class="meter-row" id="homeMicRow"><span class="ico mic"></span><span class="meter-name">麥克風</span><div class="meter wide" id="homeMicMeter"></div></div>
              <div class="meter-row" id="homeSysRow"><span class="ico speaker"></span><span class="meter-name">電腦聲音</span><div class="meter wide" id="homeSysMeter"></div></div>
            </div>
          </div>
          <div class="field screen-row">
            <label class="switch"><input type="checkbox" id="homeScreen"><span></span>同時錄製螢幕</label>
            <button class="source-btn" id="homeSource" title="選擇要錄的螢幕或視窗">
              <img id="homeSourceThumb" alt=""><span id="homeSourceName">主螢幕</span><span class="link">變更</span>
            </button>
          </div>
          <div class="field dir-row">
            <span class="lbl" style="margin:0">存到</span>
            <span class="dir-path" id="homeDir"></span>
            <button class="link" id="homeDirPick">變更</button>
            <button class="link hidden" id="homeDirReset">改回預設</button>
          </div>
          <div class="home-actions">
            <button class="btn primary big" id="homeRec"><span class="ico rec"></span>開始錄音</button>
            <button class="btn big" id="homeImport"><span class="ico import"></span>匯入音檔或影片</button>
            <span class="muted kbd-hint">Ctrl+Shift+R 隨時開始／停止</span>
          </div>
        </section>

        <section class="card">
          <h3>最近的會議</h3>
          <div id="homeRecent" class="recent"></div>
        </section>

        <section class="card">
          <h3>環境</h3>
          <div id="envCheck" class="env"></div>
        </section>
      </div>
    </div>

    <div id="settingsView" class="page hidden">
      <div class="page-inner" id="settingsBody"></div>
    </div>

    <div id="detail" class="hidden">
      <header class="topbar">
        <button class="crumb" id="crumb" title="點一下改名"></button>
        <nav class="tabs" id="tabs">
          <button data-tab="summary">摘要</button>
          <button data-tab="details">詳細</button>
          <button data-tab="transcript">逐字稿</button>
          <button data-tab="review">待確認</button>
          <button data-tab="notes">筆記</button>
        </nav>
        <div class="top-actions">
          <button class="icon-btn" id="exportBtn" title="匯出"></button>
          <button class="icon-btn" id="moreBtn" title="更多"></button>
        </div>
      </header>


      <section id="recPanel" class="hidden">
        <div class="rec-bar">
          <span class="dot"></span><strong id="recState">錄音中</strong>
          <span class="timer" id="recTimer">00:00</span>
          <span class="screen-badge hidden" id="screenBadge">螢幕錄影中</span>
          <div class="meters">
            <div class="meter-row" id="micMeterRow"><span class="ico mic"></span><div class="meter" id="micMeter"></div></div>
            <div class="meter-row" id="sysMeterRow"><span class="ico speaker"></span><div class="meter" id="sysMeter"></div></div>
          </div>
          <div class="spacer"></div>
          <button class="btn" id="pauseBtn"></button>
          <button class="btn" id="markBtn"><span class="ico star"></span>標記重點</button>
          <button class="btn" id="miniBtn" title="縮成小視窗，方便切換到會議軟體"><span class="ico shrink"></span>小視窗</button>
          <button class="btn" id="stopBtn"><span class="ico stop"></span>停止並轉錄</button>
        </div>
        <div class="rec-body">
          <div class="rec-left">
            <h3>重點標記</h3>
            <p class="hint">按「標記重點」（或 Ctrl+B）記下當下時間，整理時會優先納入。</p>
            <ul id="recMarks" class="marks"></ul>
          </div>
          <div class="splitter v" id="recSplit" title="拖曳調整寬度"></div>
          <div class="rec-right">
            <h3>我的筆記</h3>
            <p class="hint">每換一行會自動加上當下的錄音時間；整理時會優先納入這些內容。</p>
            <textarea id="recNotes" spellcheck="false"></textarea>
          </div>
        </div>
      </section>

      <div id="mediaSplit" class="media-split">
        <section id="videoPane" class="video-pane hidden">
          <video id="audio" preload="metadata" playsinline></video>
          <div class="video-tools">
            <button class="cc-btn hidden" id="vCC" title="字幕（C）">CC</button>
            <button class="icon-btn" id="vLayout" title="畫面改放右邊"></button>
            <button class="icon-btn" id="vFull" title="全螢幕（Esc 離開）"></button>
          </div>
        </section>
        <div class="splitter h hidden" id="videoSplit" title="拖曳調整畫面大小"></div>
        <div class="content-wrap" id="contentWrap">
          <div class="meta-row" id="metaRow">
            <div class="meta" id="meta"></div>
            <label class="select"><span class="ico doc"></span><select id="templateSel"></select></label>
          </div>
          <section id="content" class="content"></section>
        </div>
      </div>

      <footer id="player" class="player hidden">
        <button class="icon-btn" id="playBtn"></button>
        <span class="time" id="curTime">00:00</span>
        <div class="track" id="track">
          <div class="track-fill" id="trackFill"></div>
          <div class="track-marks" id="trackMarks"></div>
        </div>
        <span class="time" id="durTime">00:00</span>
        <button class="btn small hidden" id="ccBtn" title="字幕（C）">字幕</button>
        <button class="btn small hidden" id="videoToggle" title="顯示／隱藏畫面">畫面</button>
        <select id="rateSel" class="rate">
          <option value="0.75">0.75×</option><option value="1" selected>1×</option>
          <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
      </footer>
    </div>
  </main>
</div>

<div id="mini" class="mini hidden">
  <span class="dot"></span>
  <span class="mini-timer" id="miniTimer">00:00</span>
  <div class="meter" id="miniMeter"></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="miniPause" title="暫停／繼續"></button>
  <button class="icon-btn" id="miniMark" title="標記重點"></button>
  <button class="icon-btn" id="miniStop" title="停止並轉錄"></button>
  <button class="icon-btn" id="miniExpand" title="回到主視窗"></button>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
