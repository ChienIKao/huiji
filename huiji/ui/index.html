<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會記 Huiji</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-toolbar">
      <div class="rec-group" id="recGroup">
        <button class="icon-btn" id="recBtn" title="開始錄音 (Ctrl+Shift+R)"></button>
        <button class="icon-btn small" id="recModeBtn" title="錄音來源"></button>
      </div>
      <div class="rec-live hidden" id="recLive">
        <span class="dot"></span><span id="sideTimer">00:00</span>
        <button class="icon-btn" id="sideStop" title="停止並轉錄"></button>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="importBtn" title="匯入音檔或影片"></button>
      <button class="icon-btn" id="settingsBtn" title="設定"></button>
    </div>
    <div class="search">
      <span class="search-icon"></span>
      <input id="search" placeholder="搜尋所有會議" autocomplete="off">
    </div>
    <ul id="meetingList"></ul>
    <button id="trashBtn" class="trash-btn"><span class="ico"></span><span id="trashLabel">垃圾桶</span></button>
  </aside>

  <main id="main">
    <div id="empty" class="empty">
      <div class="empty-inner">
        <h2>會記</h2>
        <p>錄下會議，自動轉成逐字稿並整理成會議紀錄。</p>
        <div class="empty-actions">
          <button class="btn primary" id="emptyRec">開始錄音</button>
          <button class="btn" id="emptyImport">匯入音檔</button>
        </div>
        <div id="envCheck" class="env"></div>
      </div>
    </div>

    <div id="detail" class="hidden">
      <header class="topbar">
        <div class="crumb" id="crumb"></div>
        <nav class="tabs" id="tabs">
          <button data-tab="summary">摘要</button>
          <button data-tab="details">詳細</button>
          <button data-tab="transcript">逐字稿</button>
          <button data-tab="review">待確認</button>
          <button data-tab="notes">筆記</button>
        </nav>
        <div class="more-wrap">
          <button class="icon-btn" id="moreBtn" title="更多"></button>
          <div class="menu hidden" id="moreMenu"></div>
        </div>
      </header>

      <section class="head">
        <div class="title-row">
          <h1 id="title"></h1>
          <button class="link" id="editTitle">編輯</button>
        </div>
        <div class="meta-row">
          <div class="meta" id="meta"></div>
          <div class="pickers">
            <label class="select"><span class="ico doc"></span><select id="templateSel"></select></label>
          </div>
        </div>
      </section>

      <section id="recPanel" class="hidden">
        <div class="rec-bar">
          <span class="dot"></span><strong id="recState">錄音中</strong>
          <span class="timer" id="recTimer">00:00</span>
          <span class="screen-badge hidden" id="screenBadge">螢幕錄影中</span>
          <div class="meters">
            <div class="meter-row" id="micMeterRow"><span class="ico mic"></span><div class="meter" id="micMeter"></div></div>
            <div class="meter-row" id="sysMeterRow"><span class="ico speaker"></span><div class="meter" id="sysMeter"></div></div>
          </div>
          <div class="spacer"></div>
          <button class="btn" id="pauseBtn"></button>
          <button class="btn" id="markBtn"><span class="ico star"></span>標記重點</button>
          <button class="btn" id="stopBtn"><span class="ico stop"></span>停止並轉錄</button>
        </div>
        <div class="rec-body">
          <div class="rec-left">
            <h3>重點標記</h3>
            <p class="hint">按「標記重點」（或 Ctrl+B）記下當下時間，整理時會優先納入。</p>
            <ul id="recMarks" class="marks"></ul>
          </div>
          <div class="rec-right">
            <h3>我的筆記</h3>
            <p class="hint">每換一行會自動加上當下的錄音時間；整理時會優先納入這些內容。</p>
            <textarea id="recNotes" spellcheck="false"></textarea>
          </div>
        </div>
      </section>

      <section id="videoPane" class="video-pane hidden"><video id="audio" preload="metadata" playsinline></video></section>

      <section id="content" class="content"></section>

      <footer id="player" class="player hidden">
        <button class="icon-btn" id="playBtn"></button>
        <span class="time" id="curTime">00:00</span>
        <div class="track" id="track">
          <div class="track-fill" id="trackFill"></div>
          <div class="track-marks" id="trackMarks"></div>
        </div>
        <span class="time" id="durTime">00:00</span>
        <button class="btn small hidden" id="videoToggle" title="顯示／隱藏畫面">畫面</button>
        <select id="rateSel" class="rate">
          <option value="0.75">0.75×</option><option value="1" selected>1×</option>
          <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
      </footer>
    </div>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
